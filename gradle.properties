# Project properties
minecraft_version=1.20.1
forge_version=47.1.0
mod_version=1.0.0
maven_group=com.enderdevelopment
archives_base_name=isekai

# ForgeGradle properties
forge_userdev_artifact=net.minecraftforge:forge:${forge_version}:userdev
forge_group=net.minecraftforge
forge_md5=
forge_sha1=
forge_version=
forge_promoted=false
forge_webpath=https://files.minecraftforge.net/maven
forge_md5=
forge_sha1=
forge_version=
forge_promoted=false
forge_webpath=https://files.minecraftforge.net/maven

# Minecraft properties
minecraft_md5=

# Mod properties
mod_id=isekai
mod_name=Isekai
mod_description=This mod adds an isekai story to Minecraft, featuring monsters, dungeons, unions, powers, abilities, skills, and various origins like elves, wolf people, and demons.
mod_authors=EnderDevelopment
mod_url=https://example.com
mod_logo=examplemod.png

# Build properties
build_dir=build
build_libs_dir=${build_dir}/libs
build_resources_dir=${build_dir}/resources/main
build_classes_dir=${build_dir}/classes/java/main
build_sources_dir=${build_dir}/sources/java/main

# Run properties
run_dir=run
run_configurations=client,server,data

# Logging properties
forge_logging_markers=REGISTRIES
forge_logging_console_level=debug
forge_logging_file_level=debug

# Java properties
java_version=17
java_home=${System.properties['java.home']}

# Gradle properties
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# IDE properties
idea_module_version=1.20.1
idea_gradle_jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
idea_active_profile=default

# Eclipse properties
eclipse_build_id=4.26.0

# NetBeans properties
netbeans_imports=*

# VSCode properties
vscode_build_tasks=build,runClient,runServer,runData
vscode_launch_configurations=client,server,data

# IntelliJ IDEA properties
idea_sync=true
idea_gradle_version=7.6
idea_project_sdk=17
idea_language_level=17
idea_compiler_output=build/classes/java/main
idea_test_runner=gradle
idea_vmoptions=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

